const RC={'Marché':'#6d28d9','CHAMBERY NORD':'#92650a','AIX LES BAINS':'#15803d','BELLEY':'#1565c0','SAINT ALBAN LEYSSE RN':'#c2185b','LES ABRETS':'#00695c','PONT DE BEAUVOISIN':'#e65100','FRANCIN':'#7c3aed','VIVIERS DU LAC':'#dc2626'};
function rcol(n){return RC[n]||'#2563eb';}
let mo=P.months[P.months.length-1].key,re=P.restos.includes('Marché')?'Marché':P.restos[0],hist=null,lexOpen=false;
const E=s=>String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
function pn(s){if(s==null)return null;let t=String(s).replace(/\s/g,'').replace(',','.').replace('%','');if(t===''||/^n\/?a$/i.test(t))return null;const n=parseFloat(t);return isNaN(n)?null:n;}
function ds(k,v){const n=pn(v);if(n==null||n===0)return '';const lb=/OEPE|R2P/i.test(k);return (lb?n<0:n>0)?'color:var(--green);font-weight:700':'color:var(--red);font-weight:700';}
function leg(){return `<div class="leg"><span class="ll">Rang (quintile) :</span>`+[1,2,3,4,5].map(n=>`<span class="li"><span class="dot q${n}"></span>Quintile ${n}</span>`).join('')+`<span class="note">1 = meilleur · 5 = à surveiller</span></div>`;}
function ctrls(){document.getElementById('months').innerHTML=P.months.map(m=>`<button class="pill ${m.key===mo?'on':''}" onclick="sm('${m.key}')">${E(m.label)}</button>`).join('');
 document.getElementById('restos').innerHTML=P.restos.map(r=>`<button class="pill rpill ${r===re?'on':''}" style="--rc:${rcol(r)}" data-r="${E(r)}" onclick="sr(this.dataset.r)"><span class="dotr"></span>${E(r)}</button>`).join('');
 const mm=P.months.find(x=>x.key===mo);document.getElementById('upd').textContent='Scorecard '+(mm?mm.label:'')+' · '+re;}
function sm(k){mo=k;ctrls();tab();}function sr(r){re=r;ctrls();tab();}
function oh(i){const rows=(P.data[mo]&&P.data[mo][re])||[];if(rows[i]){hist=rows[i].kpi;tab();}}function ch(){hist=null;tab();}
function tab(){const box=document.getElementById('body');

   box.innerHTML=`<div class="hh"><button class="back" onclick="ch()">‹ Retour au scorecard</button><span class="htt">Historique — ${E(hist)} · ${E(re)}</span></div><div style="overflow-x:auto"><table class="t"><thead><tr><th>Mois</th><th>Mois en cours</th><th>vs 2025</th><th>YTD</th><th>vs YTD 2025</th><th>Rang YTD</th></tr></thead><tbody>${rr}</tbody></table></div>`+leg();return;}
 const rows=(P.data[mo]&&P.data[mo][re])||[];
 let h=`<div class="hint">Clique un KPI pour voir son historique mois par mois. La couleur du rang reprend le quintile du tableur.</div><div class="grid">`;
 rows.forEach((r,i)=>{const qc=r.q?('q'+r.q):'q0';const n=pn(r.vs25);const ar=n==null?'':(n>0?'▲ +':n<0?'▼ ':'');const na=/^n\/?a$/i.test(String(r.vs25||''));const dt=(r.vs25&&!na)?`${ar}${E(r.vs25)} <span class="vs">vs 2025</span>`:'';
  h+=`<button class="card ${qc}" onclick="oh(${i})" title="Voir l'historique"><div class="n">${E(r.kpi)}</div><div class="v">${E(r.cur)||'—'}</div><div class="d" style="${ds(r.kpi,r.vs25)}">${dt}</div><div class="rr"><span class="rl">Rang YTD</span><span class="rp ${qc}">${E(r.rang)||'—'}</span></div></button>`;});
 h+=`</div>`+leg();box.innerHTML=h;}
function tl(){lexOpen=!lexOpen;document.getElementById('lexBtn').classList.toggle('on',lexOpen);const el=document.getElementById('lex');if(!lexOpen){el.style.display='none';return;}el.innerHTML='<h4>Lexique</h4><dl class="lxd">'+(P.lexique||[]).map(x=>`<dt>${E(x.kpi)}</dt><dd>${E(x.def)}</dd>`).join('')+'</dl>';el.style.display='block';}
