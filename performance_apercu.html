<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu — Espace Performance</title>
<style>
:root { --bg:#f0f2f5; --card:#ffffff; --card2:#f5f6f8; --border:#dde1ea; --red:#c0392b; --green:#1e8449; --text:#1a1d2e; --muted:#6b7280; --font:'Segoe UI',system-ui,sans-serif; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); font-family:var(--font); color:var(--text); }
.main { max-width:1180px; margin:0 auto; padding:22px 20px 60px; }
.apercu-band { background:#2563eb; color:#fff; font-size:.82rem; font-weight:700; text-align:center; padding:8px; }

.perf-head { display:flex; align-items:center; justify-content:space-between; margin:2px 0 16px; flex-wrap:wrap; gap:10px; }
.perf-title { display:flex; align-items:center; gap:9px; font-size:1.05rem; font-weight:800; color:var(--text); }
.perf-title-ico { width:32px; height:32px; border-radius:9px; background:rgba(37,99,235,.14); display:inline-flex; align-items:center; justify-content:center; }
.perf-lex-btn { font-family:inherit; font-size:.74rem; font-weight:700; color:var(--muted); background:var(--card); border:1.5px solid var(--border); border-radius:9px; padding:6px 13px; cursor:pointer; }
.perf-lex-btn:hover { border-color:#2563eb; color:var(--text); }
.perf-lex-btn.on { background:#2563eb; border-color:#2563eb; color:#fff; }
.perf-empty { text-align:center; color:var(--muted); font-size:.95rem; padding:44px 8px; line-height:1.7; }
.perf-sel-lbl { font-size:.66rem; font-weight:800; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
.perf-pills { display:flex; flex-wrap:wrap; gap:7px; }
.perf-pill { border:1.5px solid var(--border); background:var(--card); color:var(--text); font-family:inherit; font-size:.78rem; font-weight:700; cursor:pointer; border-radius:20px; padding:6px 13px; transition:all .15s; }
.perf-pill:hover { border-color:#2563eb; }
.perf-pill.on { background:#2563eb; border-color:#2563eb; color:#fff; box-shadow:0 2px 8px rgba(37,99,235,.25); }
.perf-resto-pill { display:inline-flex; align-items:center; gap:7px; }
.perf-resto-pill .prp-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; background:var(--rc); }
.perf-resto-pill:hover { border-color:var(--rc); }
.perf-resto-pill.on { background:var(--rc); border-color:var(--rc); color:#fff; box-shadow:0 2px 9px rgba(0,0,0,.18); }
.perf-resto-pill.on .prp-dot { background:#fff; }
.perf-updated { font-size:.7rem; color:var(--muted); margin-top:12px; }
.perf-table { margin-top:16px; }
.perf-table th, .perf-table td { text-align:center; white-space:nowrap; }
.perf-table td:first-child, .perf-table th:first-child { text-align:left; white-space:normal; min-width:180px; font-weight:600; }
.perf-hint-line { font-size:.72rem; color:var(--muted); margin:0 0 6px; }
.perf-kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(215px,1fr)); gap:12px; margin-top:12px; }
.perf-kpi-card { text-align:left; background:var(--card); border:1.5px solid var(--border); border-radius:14px; padding:13px 15px; cursor:pointer; font-family:inherit; transition:all .18s; box-shadow:0 2px 8px rgba(0,0,0,.05); display:flex; flex-direction:column; gap:3px; min-height:118px; }
.perf-kpi-card:hover { border-color:#2563eb; transform:translateY(-2px); box-shadow:0 8px 22px rgba(37,99,235,.16); }
.pk-name { font-size:.76rem; font-weight:700; color:var(--text); line-height:1.25; }
.pk-val { font-size:1.5rem; font-weight:800; color:var(--text); margin-top:auto; }
.pk-delta { font-size:.74rem; font-weight:700; min-height:1.1em; }
.pk-vs { color:var(--muted); font-weight:400; }
.pk-rankrow { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:6px; padding-top:8px; border-top:1px solid var(--border); }
.pk-rank-lbl { font-size:.62rem; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--muted); }
.pk-rank-pill { display:inline-flex; align-items:center; font-size:.86rem; font-weight:800; padding:4px 12px; border-radius:9px; white-space:nowrap; }
/* Couleurs quintile — reprises exactement du tableur (vert → rouge) */
.pk-rank-pill.q1 { background:#00B050; color:#fff; }
.pk-rank-pill.q2 { background:#92D050; color:#274d00; }
.pk-rank-pill.q3 { background:#FFC000; color:#5a4200; }
.pk-rank-pill.q4 { background:#FF6969; color:#fff; }
.pk-rank-pill.q5 { background:#FF0000; color:#fff; }
.pk-rank-pill.q0 { background:var(--card2); color:var(--muted); border:1px solid var(--border); }
/* Léger fond de carte teinté par quintile + liseré gauche coloré */
.perf-kpi-card.q1 { border-left:4px solid #00B050; }
.perf-kpi-card.q2 { border-left:4px solid #92D050; }
.perf-kpi-card.q3 { border-left:4px solid #FFC000; }
.perf-kpi-card.q4 { border-left:4px solid #FF6969; }
.perf-kpi-card.q5 { border-left:4px solid #FF0000; }
.perf-legend { display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px; margin-top:16px; padding:11px 14px; background:var(--card2); border-radius:11px; font-size:.72rem; color:var(--muted); }
.pl-lbl { font-weight:800; color:var(--text); }
.pl-item { display:inline-flex; align-items:center; gap:5px; }
.pl-dot { width:12px; height:12px; border-radius:4px; display:inline-block; }
.pl-dot.q1{background:#00B050}.pl-dot.q2{background:#92D050}.pl-dot.q3{background:#FFC000}.pl-dot.q4{background:#FF6969}.pl-dot.q5{background:#FF0000}
.pl-note { margin-left:auto; font-style:italic; }
@media (max-width:760px){ .perf-kpi-grid { grid-template-columns:1fr 1fr; gap:9px; } .perf-kpi-card { min-height:106px; padding:11px 12px; } .pk-val { font-size:1.25rem; } .pl-note{ margin-left:0; width:100%; } }
/* ── Bloc d'analyse Performance ── */
.perf-analyse { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px 18px; margin-bottom:18px; box-shadow:0 2px 14px rgba(0,0,0,.05); }
.pa-head { margin-bottom:14px; }
.pa-title { display:block; font-size:1.02rem; font-weight:800; color:var(--text); letter-spacing:-.01em; }
.pa-sub { display:block; margin-top:4px; font-size:.82rem; color:var(--muted); line-height:1.5; }
.pa-sub b { color:var(--text); }
.pa-cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.pa-col { background:var(--card2); border-radius:13px; padding:12px 13px; }
.pa-col-h { margin-bottom:9px; }
.pa-badge { display:inline-block; font-size:.72rem; font-weight:800; padding:4px 11px; border-radius:999px; letter-spacing:.01em; }
.pa-badge.good { background:rgba(0,176,80,.14); color:#0a7d3c; }
.pa-badge.bad { background:rgba(255,0,0,.12); color:#c0261e; }
.pa-item { padding:9px 0; border-top:1px solid var(--border); }
.pa-item:first-of-type { border-top:none; }
.pa-item-top { display:flex; align-items:center; justify-content:space-between; gap:9px; }
.pa-kpi { font-size:.86rem; font-weight:700; color:var(--text); line-height:1.25; }
.pa-item .pk-rank-pill { flex-shrink:0; font-size:.7rem; padding:2px 8px; }
.pa-trends { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.pa-chip { display:inline-flex; align-items:center; gap:4px; font-size:.71rem; font-weight:700; padding:2px 8px; border-radius:7px; background:var(--card); border:1px solid var(--border); color:var(--muted); }
.pa-chip .pac-lbl { font-weight:600; opacity:.75; }
.pa-chip.good { color:#0a7d3c; border-color:rgba(0,176,80,.35); background:rgba(0,176,80,.08); }
.pa-chip.bad { color:#c0261e; border-color:rgba(255,0,0,.30); background:rgba(255,0,0,.06); }
.pa-note { display:inline-block; margin-top:6px; font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:7px; }
.pa-note.warn { color:#8a5a00; background:rgba(255,192,0,.18); }
.pa-note.up { color:#0a7d3c; background:rgba(0,176,80,.12); }
.pa-foot { margin-top:12px; font-size:.7rem; font-style:italic; color:var(--muted); line-height:1.5; }
@media (max-width:760px){ .pa-cols { grid-template-columns:1fr; } }
.perf-clickable tbody tr { cursor:pointer; transition:background .12s; }
.perf-clickable tbody tr:hover { background:rgba(37,99,235,.07); }
.perf-row-arrow { color:#2563eb; font-weight:800; opacity:0; transition:opacity .12s; }
.perf-clickable tbody tr:hover .perf-row-arrow { opacity:1; }
.perf-hist-head { display:flex; align-items:center; gap:12px; margin:2px 0 4px; flex-wrap:wrap; }
.perf-back { font-family:inherit; font-size:.8rem; font-weight:700; color:var(--text); background:var(--card); border:1.5px solid var(--border); border-radius:9px; padding:7px 13px; cursor:pointer; }
.perf-back:hover { border-color:#2563eb; }
.perf-hist-title { font-size:.95rem; font-weight:800; color:var(--text); }
.perf-quint { display:inline-block; font-size:.66rem; font-weight:800; padding:2px 9px; border-radius:20px; }
.perf-quint.q1 { background:rgba(22,101,52,.15); color:#15803d; }
.perf-quint.q2 { background:rgba(101,163,13,.15); color:#4d7c0f; }
.perf-quint.q3 { background:rgba(202,138,4,.15); color:#a16207; }
.perf-quint.q4 { background:rgba(234,88,12,.15); color:#c2410c; }
.perf-quint.q5 { background:rgba(220,38,38,.15); color:#b91c1c; }
.perf-lexique { margin-top:20px; background:var(--card); border:1.5px solid var(--border); border-radius:14px; padding:16px 18px; }
.perf-lexique h4 { margin:0 0 10px; font-size:.8rem; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:#2563eb; }
.perf-lex-def { display:grid; grid-template-columns:220px 1fr; gap:6px 14px; align-items:baseline; }
.perf-lex-def dt { font-size:.8rem; font-weight:700; color:var(--text); }
.perf-lex-def dd { font-size:.79rem; color:var(--muted); line-height:1.5; margin:0; }
@media (max-width:760px){ .perf-lex-def{ grid-template-columns:1fr; gap:1px 0; } .perf-lex-def dd{ margin-bottom:8px; } }
body.dark-mode .perf-quint.q1{ background:rgba(34,197,94,.2); color:#86efac; }
body.dark-mode .perf-quint.q5{ background:rgba(239,68,68,.22); color:#fca5a5; }

</style></head>

function _pesc(s){ return String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function loadPerformance() {
  perfHistoryKpi = null;
  const emptyEl = document.getElementById('perfEmpty');
  const ctrl = document.getElementById('perfControls');
  const body = document.getElementById('perfBody');
  const lexBtn = document.getElementById('perfLexBtn');
  const hasData = PERFORMANCE_DATA && PERFORMANCE_DATA.months && PERFORMANCE_DATA.months.length;
  if (!hasData) { if(emptyEl) emptyEl.style.display='block'; if(ctrl) ctrl.style.display='none'; if(body) body.innerHTML=''; if(lexBtn) lexBtn.style.display='none'; return; }
  if (emptyEl) emptyEl.style.display='none';
  if (ctrl) ctrl.style.display='';
  if (lexBtn) lexBtn.style.display = (PERFORMANCE_DATA.lexique && PERFORMANCE_DATA.lexique.length) ? '' : 'none';
  // défauts : dernier mois disponible, 'Marché' si présent sinon 1er resto
  const months = PERFORMANCE_DATA.months;
  if (!perfMonth || !PERFORMANCE_DATA.data[perfMonth]) perfMonth = months[months.length-1].key;
  const restos = PERFORMANCE_DATA.restos || [];
  if (!perfResto || !restos.includes(perfResto)) perfResto = restos.includes('Marché') ? 'Marché' : (restos[0] || null);
  renderPerfControls();
  renderPerfTable();
}
// Correspondance nom de feuille (fichier Performance) → clé RESTO_CFG (couleur accueil)
const PERF_RESTO_KEY = {

function perfRestoColor(name) {

function setPerfMonth(k) { perfMonth = k; renderPerfControls(); renderPerfTable(); }
function setPerfResto(r) { perfResto = r; renderPerfControls(); renderPerfTable(); }
function _pnum(s){ if(s==null) return null; let t=String(s).replace(/\s/g,'').replace(',','.').replace('%',''); if(t===''||/^n\/?a$/i.test(t)) return null; const n=parseFloat(t); return isNaN(n)?null:n; }
function perfDeltaStyle(kpi, valStr){
  const n=_pnum(valStr); if(n==null||n===0) return '';
  const lowerBetter=/OEPE|R2P/i.test(kpi);
  const good = lowerBetter ? n<0 : n>0;
  return good ? 'color:var(--green);font-weight:700' : 'color:var(--red);font-weight:700';
}
function _pquint(s){ const m=String(s||'').match(/(\d)/); return m?m[1]:''; }
// ── Analyse Performance : top 3 / à surveiller, en croisant rang réseau + tendance mensuelle + tendance annuelle ──
function _prank(rang){
  const m = String(rang||'').match(/(\d[\d\s]*)\D+?(\d[\d\s]*)\s*$/);
  if(!m) return null;
  const rank = parseInt(m[1].replace(/\s/g,''),10), tot = parseInt(m[2].replace(/\s/g,''),10);
  if(!rank || !tot || tot < 2) return null;
  return { rank, tot, good: 1 - (rank-1)/(tot-1) }; // 1 = tête de réseau, 0 = queue
}
function perfSign(kpi, valStr){
  const n = _pnum(valStr); if(n==null || n===0) return 0;
  const low = /OEPE|R2P/i.test(kpi);
  return (low ? n<0 : n>0) ? 1 : -1; // +1 favorable, -1 défavorable
}
function perfPosN(r){
  const pr = _prank(r.rang);
  if(pr) return (pr.good - 0.5) * 2;                 // -1..+1 depuis le rang réseau réel
  return ({1:1,2:0.5,3:0,4:-0.5,5:-1})[r.q] ?? 0;    // repli sur le quintile si rang illisible
}
function perfScore(r){
  // rang réseau = essentiel ; tendance annuelle (cumul) > tendance mensuelle (momentum)
  return 2.0*perfPosN(r) + 1.2*perfSign(r.kpi, r.vsytd) + 0.8*perfSign(r.kpi, r.vs25);
}
function perfTrendChip(label, kpi, valStr){
  const na = valStr==null || _pnum(valStr)==null;
  const s = perfSign(kpi, valStr);
  const cls = na ? 'flat' : (s>0 ? 'good' : s<0 ? 'bad' : 'flat');
  const arrow = na ? '·' : (s>0 ? '▲' : s<0 ? '▼' : '=');
  const val = na ? 'n/a' : _pesc(valStr);
  return `<span class="pa-chip ${cls}"><span class="pac-lbl">${label}</span> ${arrow} ${val}</span>`;
}
function _paItem(r, side){
  const qc = r.q ? ('q'+r.q) : 'q0';
  let note = '';
  if(side==='top' && perfSign(r.kpi, r.vsytd)<0) note = `<span class="pa-note warn">▼ recul annuel à confirmer</span>`;
  if(side==='watch' && perfSign(r.kpi, r.vs25)>0) note = `<span class="pa-note up">▲ amorce de redressement ce mois</span>`;
  return `<div class="pa-item">
      <div class="pa-item-top"><span class="pa-kpi">${_pesc(r.kpi)}</span><span class="pk-rank-pill ${qc}">${_pesc(r.rang)||'—'}</span></div>
      <div class="pa-trends">${perfTrendChip('Mensuel', r.kpi, r.vs25)}${perfTrendChip('Annuel', r.kpi, r.vsytd)}</div>${note}
    </div>`;
}
function renderPerfAnalyse(rows){
  const elig = rows.filter(r => r.q>=1 && r.q<=5);

  const scored = elig.map(r => ({ r, s: perfScore(r) })).sort((a,b)=> b.s - a.s);
  const top = scored.slice(0,3).map(x=>x.r);

      </div>
      <div class="pa-col">
        <div class="pa-col-h"><span class="pa-badge bad">Top 3 · à surveiller en priorité</span></div>
        ${watch.map(r=>_paItem(r,'watch')).join('')}
      </div>
    </div>
    <div class="pa-foot">Priorisation combinée : rang réseau (l'essentiel) + tendance annuelle vs YTD 2025 + tendance mensuelle vs 2025. ▲ = favorable, ▼ = défavorable — sens adapté par KPI (pour OEPE et R2P, une baisse est favorable).</div>
  </div>`;
}
function renderPerfTable() {
  const box = document.getElementById('perfBody'); if(!box) return;
  if (perfHistoryKpi) { renderPerfHistory(box); return; }
  const md = PERFORMANCE_DATA.data[perfMonth];
  const rows = (md && md[perfResto]) || [];
  if (!rows.length) { box.innerHTML = '<div class="perf-empty">Pas de données pour cette sélection.</div>'; return; }
  let h = renderPerfAnalyse(rows) + `<div class="perf-hint-line">Clique un KPI pour voir son historique mois par mois. La couleur du rang reprend le quintile du tableur (vert = meilleur, rouge = à surveiller).</div><div class="perf-kpi-grid">`;
  rows.forEach((r, i) => {
    const qc = r.q ? ('q' + r.q) : 'q0';
    const n = _pnum(r.vs25);
    const arrow = n == null ? '' : (n > 0 ? '▲ +' : n < 0 ? '▼ ' : '');
    const naVs = /^n\/?a$/i.test(String(r.vs25 || ''));
    const deltaTxt = (r.vs25 && !naVs) ? `${arrow}${_pesc(r.vs25)} <span class="pk-vs">vs 2025</span>` : '';
    h += `<button class="perf-kpi-card ${qc}" onclick="openPerfHistory(${i})" title="Voir l'historique de « ${_pesc(r.kpi)} »">
      <div class="pk-name">${_pesc(r.kpi)}</div>
      <div class="pk-val">${_pesc(r.cur) || '—'}</div>
      <div class="pk-delta" style="${perfDeltaStyle(r.kpi, r.vs25)}">${deltaTxt}</div>
      <div class="pk-rankrow"><span class="pk-rank-lbl">Rang YTD</span><span class="pk-rank-pill ${qc}">${_pesc(r.rang) || '—'}</span></div>
    </button>`;
  });
  h += `</div>` + perfLegend();
  box.innerHTML = h;
}
function openPerfHistory(i) {
  const md = PERFORMANCE_DATA.data[perfMonth];
  const rows = (md && md[perfResto]) || [];
  if (rows[i]) { perfHistoryKpi = rows[i].kpi; renderPerfControls(); renderPerfTable(); }
}
function closePerfHistory() { perfHistoryKpi = null; renderPerfControls(); renderPerfTable(); }
function perfLegend() {
  const items = [[1,'Quintile 1'],[2,'Quintile 2'],[3,'Quintile 3'],[4,'Quintile 4'],[5,'Quintile 5']];
  return `<div class="perf-legend"><span class="pl-lbl">Rang (quintile) :</span>`
    + items.map(([n,l]) => `<span class="pl-item"><span class="pl-dot q${n}"></span>${l}</span>`).join('')
    + `<span class="pl-note">1 = meilleur · 5 = à surveiller</span></div>`;
}
function renderPerfHistory(box) {
  const kpi = perfHistoryKpi;
  let rows = '';
  for (const m of PERFORMANCE_DATA.months) {
    const md = PERFORMANCE_DATA.data[m.key];
    const arr = (md && md[perfResto]) || [];
    const r = arr.find(x => x.kpi === kpi);
    if (!r) continue;
    const qc = r.q ? ('q' + r.q) : 'q0';
    rows += `<tr><td>${_pesc(m.label)}</td>`
      + `<td><b>${_pesc(r.cur)||'—'}</b></td>`
      + `<td style="${perfDeltaStyle(kpi,r.vs25)}">${_pesc(r.vs25)||'—'}</td>`
      + `<td>${_pesc(r.ytd)||'—'}</td>`
      + `<td style="${perfDeltaStyle(kpi,r.vsytd)}">${_pesc(r.vsytd)||'—'}</td>`
      + `<td><span class="pk-rank-pill ${qc}">${_pesc(r.rang)||'—'}</span></td></tr>`;
  }
  box.innerHTML = `<div class="perf-hist-head">
      <button class="perf-back" onclick="closePerfHistory()">‹ Retour au scorecard</button>
      <span class="perf-hist-title">Historique — ${_pesc(kpi)} · ${_pesc(perfResto)}</span>
    </div>
    <div style="overflow-x:auto"><table class="data-table perf-table"><thead><tr>
      <th>Mois</th><th>Mois en cours</th><th>vs 2025</th><th>YTD</th><th>vs YTD 2025</th><th>Rang YTD</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" style="color:var(--muted)">Aucun historique.</td></tr>'}</tbody></table></div>`
    + perfLegend();
}
function togglePerfLex() {
  perfLexOpen = !perfLexOpen;
  const el = document.getElementById('perfLexique');
  const btn = document.getElementById('perfLexBtn');
  if (btn) btn.classList.toggle('on', perfLexOpen);
  if (!el) return;
  if (!perfLexOpen) { el.style.display='none'; return; }
  const lex = (PERFORMANCE_DATA && PERFORMANCE_DATA.lexique) || [];
  el.innerHTML = '<h4>Lexique</h4><dl class="perf-lex-def">' +
    lex.map(x => `<dt>${_pesc(x.kpi)}</dt><dd>${_pesc(x.def)}</dd>`).join('') + '</dl>';
  el.style.display = 'block';
}
loadPerformance();
</script>
</body></html>
